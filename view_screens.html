<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Visualizador de Telas</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        .screen { margin-bottom: 40px; border: 2px solid #444; border-radius: 8px; padding: 10px; background: #2a2a2a; }
        img { max-width: 100%; height: auto; display: block; border-radius: 4px; }
        h2 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>Telas de Exemplo</h1>
    <div class="screen">
        <h2>Tela 1 (Captura de tela 2026-07-08 133312.png)</h2>
        <img src="Exemplo telas/Captura de tela 2026-07-08 133312.png" alt="Tela 1">
    </div>
    <div class="screen">
        <h2>Tela 2 (Captura de tela 2026-07-08 133433.png)</h2>
        <img src="Exemplo telas/Captura de tela 2026-07-08 133433.png" alt="Tela 2">
    </div>
</body>
</html>
